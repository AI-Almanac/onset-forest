[project]
name = "onset-forest"
version = "0.1.0"
description = "Daily monsoon onset probabilities from a CRPS random forest"
readme = "README.md"
authors = [
    { name = "hholb", email = "hholbrook@uchicago.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.6.0",
    "numba>=0.68.0",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyreadr>=0.5.7",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["onset_forest.params.ForestParams", "onset_forest.ForestParams"]
